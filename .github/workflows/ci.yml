name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: devops-intern-task

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint Python (flake8)
        run: |
          pip install flake8
          flake8 app --max-line-length=100

      - name: Lint Bash (ShellCheck)
        run: shellcheck system_health.sh

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build-and-push:
    name: Build, test and push image
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1) Build only (loaded into the local daemon) to prove the image builds.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Smoke test the freshly built image.
      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 8080:8080 "$IMAGE_NAME:ci"
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080/ && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ | jq -e '.status == "running"'
          docker rm -f smoke

      # 3) Push to Docker Hub (layers come from the cache, so this is fast).
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
